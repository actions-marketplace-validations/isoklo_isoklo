# Isoklo's own CI: type-check, lint and tests on Linux, macOS and Windows; the GitHub App's tests and Workers bundle;
# then Isoklo checks its own pull requests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run

  github-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/github-app
      - run: npm test
        working-directory: apps/github-app
      - name: Bundle for Cloudflare Workers (no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler/bundle
        working-directory: apps/github-app
        env:
          WRANGLER_SEND_METRICS: "false"

  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Dogfood: run this repository's own action on its own pull requests.
      - uses: ./
