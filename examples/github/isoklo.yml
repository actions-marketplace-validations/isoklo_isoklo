# Copy this file to .github/workflows/isoklo.yml in your repository.
# Then, in Settings → Branches (or Rules), require the "isoklo / check" status check, so GitHub refuses to merge
# a pull request until Isoklo passes.
name: isoklo

on:
  # pull_request, never pull_request_target: the gate must run with read-only access and no secrets,
  # because it reads code written by an agent or a fork.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: Isoklo compares the pull request with the point where it left the base branch.
          fetch-depth: 0
          persist-credentials: false

      # Pin to a full commit SHA in production; tags can be moved.
      - uses: isoklo/isoklo@v0
        with:
          # Optional: a maintainer adds a label to accept a deliberate change, and the reason shows in the check.
          # "isoklo-allow-config" accepts agent or CI configuration changes; "isoklo-allow-tests" accepts deleted or
          # skipped tests. Restrict who can apply labels (triage access) if you rely on these. A comment written in the
          # change itself never accepts anything: an agent could write one.
          allow-config-change: ${{ contains(github.event.pull_request.labels.*.name, 'isoklo-allow-config') && 'label isoklo-allow-config applied by a maintainer' || '' }}
          allow-test-change: ${{ contains(github.event.pull_request.labels.*.name, 'isoklo-allow-tests') && 'label isoklo-allow-tests applied by a maintainer' || '' }}
