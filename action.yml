name: Isoklo
description: 'Proof before merge. Blocks AI agent PRs that weaken tests, add fake packages, leak secrets or escalate configs.'
author: Isoklo
branding:
  icon: check-circle
  color: gray-dark

inputs:
  version:
    description: "isoklo version from npm, for example 0.1.0. Empty runs the copy of Isoklo inside this action, built on the runner."
    required: false
    default: ""
  base:
    description: "Branch or commit to compare against. Empty uses the pull request's base branch."
    required: false
    default: ""
  offline:
    description: "Set to true to skip package registry lookups (new packages are then reported as not verified)."
    required: false
    default: "false"
  allow-config-change:
    description: "A reason that turns blocked agent or CI configuration changes into review. Set it only from something agents cannot control, such as a label only maintainers can apply."
    required: false
    default: ""
  allow-test-change:
    description: "A reason that turns blocked test changes (deleted, skipped or weakened tests) into review. Set it only from something agents cannot control, such as a label only maintainers can apply. A reason written inside the change never counts."
    required: false
    default: ""
  scope:
    description: "Globs this change may touch, separated by commas or spaces (files outside are blocked). A pull request body can also declare `isoklo-scope: src/cart/**`."
    required: false
    default: ""
  sarif:
    description: "Also write SARIF 2.1.0 to this path, for github/codeql-action/upload-sarif (Security tab)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      # Pin to a full commit SHA in production; tags can be moved.
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        # setup-node v5+ caches packages automatically when the checked-out repo's package.json names a package
        # manager. Isoklo installs nothing from the user's repo, and caching on untrusted pull requests is a
        # cache-poisoning risk, so it stays off.
        package-manager-cache: false

    - name: Run Isoklo
      shell: bash
      # Inputs reach the script only through environment variables, never pasted into it with ${{ }}:
      # a crafted input cannot inject shell commands.
      env:
        ISOKLO_VERSION: ${{ inputs.version }}
        ISOKLO_BASE: ${{ inputs.base }}
        ISOKLO_OFFLINE_INPUT: ${{ inputs.offline }}
        ISOKLO_ALLOW_CONFIG: ${{ inputs.allow-config-change }}
        ISOKLO_ALLOW_TESTS: ${{ inputs.allow-test-change }}
        ISOKLO_SCOPE: ${{ inputs.scope }}
        ISOKLO_SARIF: ${{ inputs.sarif }}
        ISOKLO_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        args=(check)
        if [ -n "$ISOKLO_BASE" ]; then args+=(--base "$ISOKLO_BASE"); fi
        if [ "$ISOKLO_OFFLINE_INPUT" = "true" ]; then args+=(--offline); fi
        if [ -n "$ISOKLO_ALLOW_CONFIG" ]; then args+=(--allow-config-change "$ISOKLO_ALLOW_CONFIG"); fi
        if [ -n "$ISOKLO_ALLOW_TESTS" ]; then args+=(--allow-test-change "$ISOKLO_ALLOW_TESTS"); fi
        if [ -n "$ISOKLO_SARIF" ]; then args+=(--sarif "$ISOKLO_SARIF"); fi
        # set -f: the globs go to Isoklo as written, not expanded against the runner's files.
        set -f; for glob in ${ISOKLO_SCOPE//,/ }; do args+=(--scope "$glob"); done; set +f
        if [ -n "$ISOKLO_VERSION" ]; then
          if ! [[ "$ISOKLO_VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error title=Isoklo could not run::version input is not a valid version: nothing was approved."
            exit 2
          fi
          npx --yes "isoklo@${ISOKLO_VERSION}" "${args[@]}"
        else
          (cd "$ISOKLO_ACTION_PATH" && npm ci --ignore-scripts --no-audit --no-fund >/dev/null && npm run build --silent >/dev/null)
          node "$ISOKLO_ACTION_PATH/dist/cli.js" "${args[@]}"
        fi
